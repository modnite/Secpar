[package]
name = "secpar-desktop"
version = "3.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[dependencies]
sha2 = "0.10.9"
secpar-client = { path = "../crates/secpar-client" }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
openh264 = "0.9.8"
cpal = "0.17"
opus = "0.4.0"
serde_json = "1.0.154"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
open = "5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.reed-solomon-erasure]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.dev.package.openh264]
opt-level = 3

[build-dependencies]
tauri-winres = "0.3.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
tray-icon = { version = "0.25.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[features]
tray-review = []
ui-review = ["eframe/__screenshot"]

[[bin]]
name = "secpar-desktop-review"
path = "src/review.rs"
required-features = ["ui-review"]

[[bin]]
name = "secpar-tray-review"
path = "src/tray_review_main.rs"
required-features = ["tray-review"]
