[package]
name = "secpar-desktop"
version = "3.16.8"
edition = "2021"
license = "GPL-3.0"
publish = false

[dependencies]
sha2 = "0.10.9"
secpar-client = { path = "../crates/secpar-client" }
secpar-stream = { path = "../crates/secpar-stream" }
secpar-clipboard = { path = "../crates/secpar-clipboard" }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
openh264 = "0.9.8"
cpal = "0.17"
opus = "0.4.0"
serde_json = "1.0.154"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
open = "5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.reed-solomon-erasure]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Decoding and erasure coding are the hot loops, so they stay fully optimized.
[profile.release.package.openh264-sys2]
opt-level = 3

[profile.release.package.openh264]
opt-level = 3

[profile.release.package.reed-solomon-erasure]
opt-level = 3

[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.dev.package.openh264]
opt-level = 3

[build-dependencies]
tauri-winres = "0.3.6"

[target.'cfg(windows)'.dependencies]
# The hosting service and server run from this same executable (--service, --server).
secpar-host = { path = "../host/src-tauri", default-features = false }
raw-window-handle = "0.6.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Variant"] }
tray-icon = { version = "0.25.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Power", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse","Win32_Media"] }

[features]
tray-review = []
ui-review = ["eframe/__screenshot"]

[[bin]]
name = "secpar-desktop-review"
path = "src/review.rs"
required-features = ["ui-review"]

[target.'cfg(target_os = "linux")'.dependencies]
secpar-host-linux = { path = "../crates/secpar-host-linux" }
dbus = "0.9"
libc = "0.2"
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
gstreamer-video = "0.24.5"

[[bin]]
name = "secpar-tray-review"
path = "src/tray_review_main.rs"
required-features = ["tray-review"]

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
secpar-stream = { path = "../crates/secpar-stream" }
base64 = "0.23.1"
futures-util = { version = "0.3.34", features = ["sink"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
ring = "0.17.14"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
