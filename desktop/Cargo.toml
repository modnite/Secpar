[package]
name = "secpar-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[dependencies]
secpar-client = { path = "../crates/secpar-client" }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
openh264 = "0.9.8"
cpal = "0.17"
opus = "0.4.0"
serde_json = "1.0.154"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
open = "5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time"] }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.reed-solomon-erasure]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.dev.package.openh264]
opt-level = 3

[build-dependencies]
tauri-winres = "0.3.6"

[features]
ui-review = ["eframe/__screenshot"]

[[bin]]
name = "secpar-desktop-review"
path = "src/review.rs"
required-features = ["ui-review"]
