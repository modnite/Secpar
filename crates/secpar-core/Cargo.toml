[package]
name = "secpar-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
keyring = { version = "3.6.3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
secpar-tunnel = { path = "../secpar-tunnel" }
base64 = "0.23.1"
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
