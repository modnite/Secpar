[package]
name = "secpar-android"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
secpar-core = { path = "../secpar-core" }
secpar-tunnel = { path = "../secpar-tunnel" }
jni = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "sync"] }
