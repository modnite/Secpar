[package]
name = "secpar-moonlight"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "The Moonlight streaming protocol core (moonlight-common-c) inside Secpar's own apps, without Moonlight's applications."

[dependencies]
aes = "0.8.4"
aes-gcm = "0.10.3"
getrandom = "0.2.17"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9.8", default-features = false, features = ["std", "sha2"] }
sha2 = "0.10.9"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }

[build-dependencies]
cc = "1.2"
