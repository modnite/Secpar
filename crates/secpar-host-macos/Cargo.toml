[package]
name = "secpar-host-macos"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[dependencies]
secpar-host-core = { path = "../secpar-host-core" }
# Identity, pairing store and private-file helpers are platform neutral; reused, not forked.
secpar-host-linux = { path = "../secpar-host-linux" }
secpar-stream = { path = "../secpar-stream" }
opus = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
get_if_addrs = "0.5.3"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1.2", features = ["macos_13_0"] }
core-foundation = "0.10"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
