[package]
name = "secpar-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[dependencies]
secpar-network = { path = "../secpar-network" }
secpar-stream = { path = "../secpar-stream" }
base64 = "0.23.1"
futures-util = { version = "0.3.34", features = ["sink"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
tokio = { version = "1.53.3", features = ["test-util"] }

[profile.dev.package.reed-solomon-erasure]
opt-level = 3
