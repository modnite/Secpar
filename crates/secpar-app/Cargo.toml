[package]
name = "secpar-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Test-only stand-in for the Moonlight stream component. It is never built unless
# the `fake-stream` feature is requested, so release packages cannot include it.
[[bin]]
name = "fake-stream"
path = "src/bin/fake_stream.rs"
required-features = ["fake-stream"]

[features]
default = []
fake-stream = []

[dependencies]
secpar-core = { path = "../secpar-core" }
secpar-service = { path = "../secpar-service" }
base64 = "0.23.1"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "process"] }

[dev-dependencies]
secpar-hosting = { path = "../secpar-hosting" }
secpar-tunnel = { path = "../secpar-tunnel" }
ring = "0.17.14"
serde_json = "1.0.154"
tempfile = "3"
tokio = { version = "1.53.3", features = ["rt", "net", "time"] }
