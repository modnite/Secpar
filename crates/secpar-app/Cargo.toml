[package]
name = "secpar-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
secpar-core = { path = "../secpar-core" }
secpar-service = { path = "../secpar-service" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
secpar-hosting = { path = "../secpar-hosting" }
secpar-tunnel = { path = "../secpar-tunnel" }
tempfile = "3"
