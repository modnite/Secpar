[package]
name = "secpar-hosting"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
secpar-core = { path = "../secpar-core" }
secpar-tunnel = { path = "../secpar-tunnel" }
secpar-gamestream-host = { path = "../secpar-gamestream-host" }
igd-next = { version = "0.18.0", default-features = false, features = ["aio_tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }

[dev-dependencies]
base64 = "0.23.1"
ring = "0.17.14"
tempfile = "3"
