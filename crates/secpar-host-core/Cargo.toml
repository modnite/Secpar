[package]
name = "secpar-host-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Shared Secpar host protocol and authenticated control sessions"
publish = false

[dependencies]
base64 = "0.23.1"
ring = "0.17.14"
rustls-platform-verifier = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.53.3", features = ["test-util"] }
