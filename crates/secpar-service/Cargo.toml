[package]
name = "secpar-service"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
secpar-core = { path = "../secpar-core" }
secpar-tunnel = { path = "../secpar-tunnel" }
secpar-hosting = { path = "../secpar-hosting" }
secpar-gamestream-host = { path = "../secpar-gamestream-host" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"
