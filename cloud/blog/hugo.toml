# secpar.win/blog, built with Hugo (https://gohugo.io, Apache-2.0).
# The deploy workflow pins the Hugo version and builds into ../site/public/blog.
baseURL = "https://secpar.win/blog/"
title = "Secpar blog"
locale = "en"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = false
timeZone = "UTC"

[frontmatter]
# Posts from the editor set "date"; a hand-written 2026-11-20-title.md file takes its date from the name.
date = ["date", ":filename", ":default"]

[permalinks.page]
posts = "/:slug/"

[pagination]
pagerSize = 20

[services.rss]
limit = 20

[outputs]
home = ["html", "rss"]
section = ["html"]

[markup.goldmark.renderer]
unsafe = false

[markup.highlight]
noClasses = false
codeFences = false

[minify]
minifyOutput = true
