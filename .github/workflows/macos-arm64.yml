name: Mac Apple Silicon fallback build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit to build
        type: string
        required: true
        default: main
      cross_compile:
        description: Build ARM on the Intel Mac pool when ARM runners are unavailable
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  macos:
    runs-on: ${{ inputs.cross_compile && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: /tmp/secpar-target
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure loopback addresses for multi-route tests
        run: |
          # These fixtures use distinct addresses on one port. macOS requires
          # explicit aliases; Windows/Linux already route the loopback subnet.
          for suffix in 2 3 4 5; do
            sudo ifconfig lo0 inet "127.0.0.$suffix" netmask 255.255.255.255 alias
          done
      - name: Test and package Apple Silicon desktop client
        run: |
          for manifest in crates/secpar-stream/Cargo.toml crates/secpar-network/Cargo.toml crates/secpar-client/Cargo.toml desktop/Cargo.toml; do
            cargo test --locked --manifest-path "$manifest"
          done
          if [ "${{ inputs.cross_compile }}" = "true" ]; then
            test "$(uname -m)" = x86_64
            rustup target add aarch64-apple-darwin
            cargo build --release --locked --target aarch64-apple-darwin --manifest-path desktop/Cargo.toml
            CARGO_TARGET_DIR=/tmp/secpar-target/aarch64-apple-darwin python3 desktop/package.py macos
          else
            test "$(uname -m)" = arm64
            cargo build --release --locked --manifest-path desktop/Cargo.toml
            python3 desktop/package.py macos
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Secpar-Desktop-development-macOS-arm64
          path: dist-desktop/Secpar-Desktop-development-macos-arm64.tar.gz
          if-no-files-found: error
