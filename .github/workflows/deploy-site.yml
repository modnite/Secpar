name: Deploy Secpar website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/site/**'
      - 'cloud/blog/**'
      - 'cloud/scripts/cloudflare.mjs'
      - '.github/workflows/deploy-site.yml'
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: secpar-website-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, secpar]
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECPAR_SERVICE: site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: cloud/accounts
      - name: Resolve the current public downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cloud/site/generate-downloads.mjs
      - name: Build the blog with Hugo
        timeout-minutes: 25
        env:
          HUGO_VERSION: '0.170.1'
          HUGO_SHA256: '841a5462853aefc9942e4de1e8a5d75584b6a5181941e6ad3f1d745190e03cd8'
        run: |
          # Kept in the runner's tool cache: the runner downloads slowly, so Hugo is fetched once per version.
          dir="${RUNNER_TOOL_CACHE:-$HOME/.cache}/hugo/${HUGO_VERSION}"
          if [ ! -x "$dir/hugo" ]; then
            tmp="$(mktemp -d)"
            curl --fail --location --retry 3 --max-time 1200 -o "$tmp/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
            echo "${HUGO_SHA256}  $tmp/hugo.tar.gz" | sha256sum --check --strict
            mkdir -p "$dir" && tar -xzf "$tmp/hugo.tar.gz" -C "$dir" hugo && rm -rf "$tmp"
          fi
          "$dir/hugo" version
          "$dir/hugo" --source cloud/blog --destination "$GITHUB_WORKSPACE/cloud/site/public/blog" --cleanDestinationDir --panicOnWarning
          test -f cloud/site/public/blog/index.html
      - name: Add the blog editor (Decap CMS)
        timeout-minutes: 15
        env:
          DECAP_VERSION: '3.18.0'
          DECAP_SHA256: 'ff32452465bb6d18557b53d3345da4c79d13e0e4fabc74971e72e1152bda384e'
        run: |
          # Kept in the runner's tool cache and checked against the pinned hash.
          file="${RUNNER_TOOL_CACHE:-$HOME/.cache}/decap-cms/${DECAP_VERSION}/decap-cms.js"
          if ! echo "${DECAP_SHA256}  $file" | sha256sum --check --strict --status 2>/dev/null; then
            mkdir -p "$(dirname "$file")"
            curl --fail --location --retry 3 --max-time 900 -o "$file.part" "https://unpkg.com/decap-cms@${DECAP_VERSION}/dist/decap-cms.js"
            echo "${DECAP_SHA256}  $file.part" | sha256sum --check --strict
            mv "$file.part" "$file"
          fi
          cp "$file" cloud/site/public/editor/decap-cms.js
      - name: Check the website code
        run: |
          node --check cloud/site/src/worker.js
          node --check cloud/site/public/site.js
          node --check cloud/site/src/comments.js
          node --check cloud/site/public/assets/comments.js
          node --check cloud/site/public/assets/comments-admin.js
      - id: config
        run: node cloud/scripts/cloudflare.mjs prepare
      - name: Apply blog comment migrations
        working-directory: cloud/accounts
        run: npx wrangler d1 migrations apply secpar-blog --remote --config "${{ steps.config.outputs.site }}"
      - name: Deploy the public site
        working-directory: cloud/accounts
        run: npx wrangler deploy --config "${{ steps.config.outputs.site }}"
      - name: Configure blog comment secrets
        env:
          BLOG_ADMIN_KEY: ${{ secrets.BLOG_ADMIN_KEY }}
          BLOG_GITHUB_CLIENT_ID: ${{ secrets.BLOG_GITHUB_CLIENT_ID }}
          BLOG_GITHUB_CLIENT_SECRET: ${{ secrets.BLOG_GITHUB_CLIENT_SECRET }}
        run: node cloud/scripts/cloudflare.mjs site-secrets
      - name: Check the public domain
        run: |
          curl --fail --max-time 20 --retry 3 --retry-delay 5 https://secpar.win/health ||
            curl --doh-url https://cloudflare-dns.com/dns-query --fail --max-time 20 https://secpar.win/health
