name: Deploy Secpar Cloudflare services
on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        type: choice
        options: [accounts, relay, both]
        default: accounts
permissions:
  contents: read
concurrency:
  group: secpar-cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, secpar]
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECPAR_SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: cloud/accounts
      - run: npm run check && npm test
        working-directory: cloud/accounts
      - id: config
        run: node cloud/scripts/cloudflare.mjs prepare
      - name: Apply the account database migrations
        if: inputs.service == 'accounts' || inputs.service == 'both'
        working-directory: cloud/accounts
        run: npx wrangler d1 migrations apply secpar-accounts --remote --config "${{ steps.config.outputs.accounts }}"
      - name: Deploy the account service
        if: inputs.service == 'accounts' || inputs.service == 'both'
        working-directory: cloud/accounts
        run: npx wrangler deploy --config "${{ steps.config.outputs.accounts }}"
      - name: Seed the admission signing key once
        if: inputs.service == 'accounts' || inputs.service == 'both'
        run: node cloud/scripts/cloudflare.mjs signing-key
      - name: Install the rendezvous build dependencies
        if: inputs.service == 'relay' || inputs.service == 'both'
        working-directory: cloud/rendezvous
        run: npm ci --ignore-scripts
      - name: Test and deploy the rendezvous service
        if: inputs.service == 'relay' || inputs.service == 'both'
        working-directory: cloud/rendezvous
        run: npm test && npx wrangler deploy --config "${{ steps.config.outputs.relay }}"
      - name: Check the deployed account service
        if: inputs.service == 'accounts' || inputs.service == 'both'
        run: curl --fail --retry 5 --retry-delay 5 https://accounts.secpar.win/health
