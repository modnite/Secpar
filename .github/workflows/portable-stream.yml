name: Portable stream protocol
on:
  push:
    branches: [main]
    paths:
      - 'crates/secpar-stream/**'
      - 'docs/prs-vectors.json'
      - '.github/workflows/portable-stream.yml'
  pull_request:
    paths:
      - 'crates/secpar-stream/**'
      - 'docs/prs-vectors.json'
      - '.github/workflows/portable-stream.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    # Fork code is never scheduled on the personal desktop or OMV server.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: protocol (${{ matrix.platform }}, self-hosted)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            shell: powershell
            runner: [self-hosted, Windows, X64, secpar]
          - platform: Linux
            shell: bash
            runner: [self-hosted, Linux, X64, secpar]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prefer Git Bash over the Windows WSL launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gitBin = Join-Path (Split-Path (Get-Command git).Source) '../bin'
          if (!(Test-Path (Join-Path $gitBin 'bash.exe'))) { throw 'Git Bash is required' }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path crates/secpar-stream/Cargo.toml
        shell: ${{ matrix.shell }}
  macos:
    name: protocol (macOS, GitHub-hosted)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path crates/secpar-stream/Cargo.toml
