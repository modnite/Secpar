name: Portable stream protocol
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'desktop/**'
      - 'assets/branding/**'
      - 'docs/prs-vectors.json'
      - '.github/workflows/portable-stream.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'desktop/**'
      - 'assets/branding/**'
      - 'docs/prs-vectors.json'
      - '.github/workflows/portable-stream.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    # Fork code is never scheduled on the personal desktop or OMV server.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: protocol (${{ matrix.platform }}, self-hosted)
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            rustup: C:/actions-runner-secpar/_tool/rustup
            cargo: C:/actions-runner-secpar/_tool/cargo
            target: D:/Secpar-CI/target
            runner: [self-hosted, Windows, X64, secpar]
          - platform: Linux
            rustup: /opt/secpar-runner/_work/_tool/rustup
            cargo: /opt/secpar-runner/_work/_tool/cargo
            target: /opt/secpar-runner/_work/_tool/target
            runner: [self-hosted, Linux, X64, secpar]
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_HOME: ${{ matrix.rustup }}
      CARGO_HOME: ${{ matrix.cargo }}
      CARGO_TARGET_DIR: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prefer Git Bash over the Windows WSL launcher
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy RemoteSigned -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBin = Join-Path (Split-Path (Get-Command git).Source) '../bin'
          if (!(Test-Path (Join-Path $gitBin 'bash.exe'))) { throw 'Git Bash is required' }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
      - name: Test protocol on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy RemoteSigned -File {0}
        run: |
          foreach ($manifest in @('crates/secpar-stream/Cargo.toml', 'crates/secpar-network/Cargo.toml', 'crates/secpar-client/Cargo.toml', 'desktop/Cargo.toml')) {
            cargo test --locked --manifest-path $manifest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test protocol on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for manifest in crates/secpar-stream/Cargo.toml crates/secpar-network/Cargo.toml crates/secpar-client/Cargo.toml desktop/Cargo.toml; do
            cargo test --locked --manifest-path "$manifest"
          done
  macos:
    name: protocol (macOS, GitHub-hosted)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: /tmp/secpar-target
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          for manifest in crates/secpar-stream/Cargo.toml crates/secpar-network/Cargo.toml crates/secpar-client/Cargo.toml desktop/Cargo.toml; do
            cargo test --locked --manifest-path "$manifest"
          done
