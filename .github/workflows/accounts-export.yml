name: Export the account database to the self-hosted service
on: workflow_dispatch
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, secpar]
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECPAR_SERVICE: accounts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
        working-directory: cloud/accounts
      - id: config
        run: node cloud/scripts/cloudflare.mjs prepare
      # Schema and rows, written only to the box's private folder; nothing is uploaded or printed.
      - name: Export the database
        working-directory: cloud/accounts
        run: |
          umask 077
          npx wrangler d1 export secpar-accounts --remote --config "${{ steps.config.outputs.accounts }}" --output /opt/secpar-accounts/inbox/export.sql
          wc -c /opt/secpar-accounts/inbox/export.sql
