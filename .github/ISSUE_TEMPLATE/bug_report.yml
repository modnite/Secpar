name: Bug report
description: Something in Secpar does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [help page](https://secpar.win/help/) first. Do not paste passwords, account emails or pairing links.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Secpar on ...
        2. Connect to ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Secpar version
      description: Settings › About shows it.
      placeholder: "4.0.10"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Computer you connect to
      description: Operating system and, for Linux, the desktop (for example KDE Plasma on Wayland).
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Device you connect from
      description: Windows, Linux or Android, with the model or distribution.
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Connection
      options:
        - Same network
        - Over the internet
        - Not sure
  - type: textarea
    id: error
    attributes:
      label: Error details
      description: Use the copy button next to a connection error and paste it here.
      render: text
