// The pinned Moonlight Android client, compiled as a library inside Secpar's one
// Android app. Its sources are used unchanged; Secpar adds no parallel engine UI.
// Point -PsecparMoonlightSource at a prepared checkout, or keep a complete copy in
// upstream/moonlight-android (git submodule: java, res and every native submodule).
//
// The tunnel library beside it is built separately, into app/src/main/jniLibs/arm64-v8a:
//   ANDROID_NDK_HOME=<sdk>/ndk/28.2.13676358 \
//     sh scripts/build-android-core.sh "$PWD/app/src/main/jniLibs/arm64-v8a"
// Use an absolute output folder: the script changes directory before copying.
def completeMoonlight(File dir) {
    // The native core needs every nested submodule, not only the Java sources.
    def needed = [
        'app/src/main/java/com/limelight/Game.java',
        'app/src/main/jni/moonlight-core/Android.mk',
        'app/src/main/jni/moonlight-core/moonlight-common-c/src/Connection.c',
        'app/src/main/jni/moonlight-core/moonlight-common-c/enet/peer.c',
        'app/src/main/jni/moonlight-core/moonlight-common-c/nanors/rs.c',
        'app/src/main/jni/moonlight-core/moonlight-common-c/nanors/deps/obl/oblas_common.c',
        'app/src/main/jni/moonlight-core/openssl/Android.mk',
        'app/src/main/jni/moonlight-core/opus/Android.mk',
    ]
    return needed.every { new File(dir, it).isFile() }
}

def moonlightDir() {
    def given = findProperty('secparMoonlightSource')
    if (given) {
        def dir = file(given)
        if (!completeMoonlight(dir)) throw new GradleException("secparMoonlightSource=$dir is not a complete Moonlight Android checkout")
        return dir
    }
    def inRepo = file('../../upstream/moonlight-android')
    if (completeMoonlight(inRepo)) return inRepo
    def prepared = file('D:/Secpar-CI/s4/a/moonlight-android')
    if (completeMoonlight(prepared)) return prepared
    throw new GradleException(
        'The Moonlight Android sources are missing. Run\n' +
            '  git submodule update --init --recursive upstream/moonlight-android\n' +
            'or pass -PsecparMoonlightSource=<folder> with a complete checkout.')
}

apply plugin: 'com.android.library'

android {
    // Moonlight's own package, so its sources and R class need no edits.
    namespace 'com.limelight'
    compileSdk 37
    // The app's SDK 28 NDK; Moonlight's makefiles do not need a newer one.
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 26
        // Only phones; the debug app keeps the emulator working through x86_64.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        buildConfigField "boolean", "ROOT_BUILD", "false"
        // A library's BuildConfig has no APPLICATION_ID; Moonlight's poster provider names its
        // authority with it. The provider is not declared by Secpar, so any stable value does.
        buildConfigField "String", "APPLICATION_ID", '"com.pcremote.app"'
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    sourceSets {
        main {
            // Secpar's own manifest for this module: the app declares only the
            // activities it actually starts, so one launcher and one theme remain.
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = [new File(moonlightDir(), 'app/src/main/java')]
            res.srcDirs = [new File(moonlightDir(), 'app/src/main/res')]
            assets.srcDirs = [new File(moonlightDir(), 'app/src/main/assets')]
        }
    }

    externalNativeBuild {
        ndkBuild {
            path new File(moonlightDir(), 'app/src/main/jni/Android.mk')
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    // The same libraries Moonlight 12.2 declares; the app already brings OkHttp.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
