apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    compileSdk 37

    namespace 'com.pcremote'

    defaultConfig {
        // PC Remote's UI is English-only for now; mixed-language screens look broken
        androidResources.localeFilters += ['en']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdk 26
        targetSdk 36

        versionName "4.2.0-r14"
        versionCode = 581
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
        compose = true
    }

    productFlavors {
        nonRoot {
            applicationId "com.pcremote.app"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    // Release signing comes from ~/.pcremote/keystore.properties (kept out of the repo).
    def ksFile = new File(System.getProperty("user.home"), ".pcremote/keystore.properties")
    signingConfigs {
        if (ksFile.exists()) {
            release {
                def ks = new Properties()
                ksFile.withInputStream { ks.load(it) }
                storeFile new File(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Secpar (Debug)"
            resValue "string", "app_label_root", "Secpar (Debug)"
        }
        release {
            resValue "string", "app_label", "Secpar"
            resValue "string", "app_label_root", "Secpar"

            // Phones are 64-bit ARM. Other ABIs only add native-library weight; debug
            // builds keep every ABI so the x86-64 emulator still works.
            ndk { abiFilters += ['arm64-v8a', 'armeabi-v7a'] }
            minifyEnabled true
            shrinkResources true
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // AAudio output for stream audio (app/src/main/cpp).
    ndkVersion "28.2.13676358"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/*.md'
            // BouncyCastle's post-quantum test vectors; the stream's certificate
            // code never uses them.
            excludes += 'org/bouncycastle/pqc/**'
        }
        // Native libraries are stored compressed, which halves the download.
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'


    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'androidx.navigation:navigation-compose:2.9.5'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.85' // test certificates only
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
